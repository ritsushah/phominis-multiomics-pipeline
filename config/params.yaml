# Pipeline parameters for P. hominis multi-omics detection

genome:
  fasta: "data/genomes/Phominis_Hs3NIH.fna"
  accession: "GCA_047301545.1"
  strain: "Hs-3:NIH"

markers:
  dir: "data/markers"
  files:
    - "OP353527.fasta"
    - "JN007007.fasta"
    - "AY758392.fasta"

detection:
  kmer_size: 31
  min_coverage: 1
  min_reads: 5
  confidence_threshold: 0.1

ml:
  random_state: 42
  n_splits: 5
  test_size: 0.2
  models:
    - "xgboost"
    - "random_forest"
    - "elastic_net"
  unsupervised:
    n_neighbors: 15
    min_cluster_size: 5

output:
  dir: "results"
  figures: "results/figures"
  reports: "results/reports"

resources:
  cpus: 8
  memory: "16.GB"
